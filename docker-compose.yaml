version: "3.8"

services:
  frontend:
    env_file: ".env"
    image: marceldragz/conduit-frontend:v1.0
    container_name: conduit-frontend
    ports:
      - "8282:80"

  backend:
    env_file: ".env"
    image: marceldragz/conduit-backend:v1.0
    container_name: conduit-backend
    volumes:
      - ./conduit-db:/app/db_data
    ports:
      - "8000:8000"
    restart: on-failure

volumes:
  conduit-db:
