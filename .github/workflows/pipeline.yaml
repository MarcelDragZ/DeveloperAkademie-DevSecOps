name: Conduit Deployment

on:
  push:
    branches: ["conduit-deployment"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marceldragz/conduit-frontend:latest
            ghcr.io/marceldragz/conduit-frontend:v1.0

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marceldragz/conduit-backend:latest
            ghcr.io/marceldragz/conduit-backend:v1.0

  transfer:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Transfer docker-compose.yml and .env to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yaml,sample.env"
          target: ${{ vars.PROJECT_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: [transfer]
    steps:
      - name: SSH into Server and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔧 Logging into GitHub Container Registry..."
            echo "${{ secrets.GIT_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "🔧 Navigating to project directory..."
            cd ${{ vars.PROJECT_PATH }}

            echo "🔧 Move .env file"
            mv sample.env .env

            echo "🔧 Stopping und Entfernen vorhandener Container..."
            docker-compose down --remove-orphans || true

            echo "🔧 Bringing up containers..."
            docker-compose up -d --remove-orphans

            echo "✅ Deployment completed successfully!"

  verify_containers:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Start SSH Agent
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ vars.PROJECT_PATH }}
            RUNNING_CONTAINERS=$(docker-compose ps | grep "Up" | wc -l)
            if [ "$RUNNING_CONTAINERS" -eq 0 ]; then
              echo "❌ No containers are running!"
              exit 1
            fi
            echo "✅ All containers are running!"
